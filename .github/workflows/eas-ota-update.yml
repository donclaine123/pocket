name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "widget-preview.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🚀 Publish EAS OTA Update to Preview & Production Channels
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Publishing OTA update to preview channel..."
          eas update --channel preview --message "${{ github.event.head_commit.message || 'OTA Update' }}" --non-interactive
          echo "Publishing OTA update to production channel..."
          eas update --channel production --message "${{ github.event.head_commit.message || 'OTA Update' }}" --non-interactive
