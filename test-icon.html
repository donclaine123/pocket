<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Icon Preview</title>
    <style>
        body {
            margin: 0;
            padding: 60px 24px;
            background-color: #F7F0E3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #3B3330;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #3B3330;
        }

        p.subtitle {
            font-size: 14px;
            color: #7A706B;
            margin-top: 0;
            margin-bottom: 36px;
        }

        .showcase-container {
            display: flex;
            justify-content: center;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background-color: #FFFDF7;
            border-top: 2px solid #3B3330;
            border-left: 2px solid #3B3330;
            border-right: 5px solid #3B3330;
            border-bottom: 6px solid #3B3330;
            border-radius: 24px;
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 5px 0px #3B3330;
        }

        .card-label {
            font-size: 15px;
            font-weight: 800;
            margin-top: 24px;
            color: #3B3330;
        }

        .card-sub {
            font-size: 12px;
            color: #A79A8C;
            margin-top: 4px;
        }

        /* =======================================================
           ICON: Tilted (-8deg) + Subtly Peeking Penny Coin
           ======================================================= */
        .icon-box-tilted {
            display: inline-block;
            position: relative;
            width: 88px;
            height: 88px;
            transform: rotate(-8deg);
            -webkit-transform: rotate(-8deg);
        }

        /* Peeking Golden Penny Coin (Tucked in slightly more) */
        .penny-coin {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #FFD166;
            border: 2px solid #3B3330;
            box-sizing: border-box;
            z-index: 1;
            text-align: center;
        }

        .coin-inner-ring {
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid rgba(122, 79, 1, 0.35);
            border-radius: 50%;
            box-sizing: border-box;
            text-align: center;
        }

        .coin-symbol {
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #7A4F01;
            line-height: 24px;
            text-align: center;
        }

        /* Solid Shadow Underlay */
        .pocket-shadow {
            position: absolute;
            top: 14px;
            left: 8px;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background-color: #3B3330;
            z-index: 2;
        }

        /* Pocket Squircle Body */
        .pocket-body {
            position: absolute;
            top: 10px;
            left: 4px;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background-color: #FF9E7E;
            border: 2px solid #3B3330;
            box-sizing: border-box;
            z-index: 3;
            text-align: center;
            overflow: hidden;
        }

        /* Top Stitch Line */
        .pocket-top-stitch {
            position: absolute;
            top: 12px;
            left: 10px;
            right: 10px;
            border-top: 2px dashed rgba(255, 255, 255, 0.85);
            height: 0;
        }

        /* Corner Brass Rivets */
        .pocket-rivet {
            position: absolute;
            top: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #FFD166;
            border: 1.5px solid #3B3330;
            box-sizing: border-box;
        }

        .pocket-rivet-left {
            left: 8px;
        }

        .pocket-rivet-right {
            right: 8px;
        }

        /* Bottom Curved Stitch Line */
        .pocket-bottom-stitch {
            position: absolute;
            bottom: 7px;
            left: 10px;
            right: 10px;
            height: 18px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.65);
            border-left: 2px dashed rgba(255, 255, 255, 0.65);
            border-right: 2px dashed rgba(255, 255, 255, 0.65);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            box-sizing: border-box;
        }

        /* Bold White 'p' */
        .pocket-letter {
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #FFFDF7;
            line-height: 64px;
            text-align: center;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <h1>Pocket Icon Sandbox</h1>
    <p class="subtitle">Live preview of the Tilted (-8°) + Peeking Coin icon</p>

    <div class="showcase-container">
        <!-- Tilted (-8deg) with Subtly Peeking Coin -->
        <div class="card">
            <div class="icon-box-tilted">
                <!-- Coin -->
                <div class="penny-coin">
                    <div class="coin-inner-ring">
                        <span class="coin-symbol">₱</span>
                    </div>
                </div>
                <!-- Shadow -->
                <div class="pocket-shadow"></div>
                <!-- Pocket Body -->
                <div class="pocket-body">
                    <div class="pocket-top-stitch"></div>
                    <div class="pocket-rivet pocket-rivet-left"></div>
                    <div class="pocket-rivet pocket-rivet-right"></div>
                    <div class="pocket-bottom-stitch"></div>
                    <span class="pocket-letter">p</span>
                </div>
            </div>
            <div class="card-label">Tilted (-8°) + Peeking Coin</div>
            <div class="card-sub">Splash / Email Featured Size (88px)</div>
        </div>
    </div>

</body>

</html>
