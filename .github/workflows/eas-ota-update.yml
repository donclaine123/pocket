name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "widget-preview.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Pull EAS Environment Variables from Expo Dashboard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull production --path .env.prod --non-interactive || true
          eas env:pull preview --path .env.prev --non-interactive || true
          eas env:pull development --path .env.dev --non-interactive || true
          cat .env.prod .env.prev .env.dev > .env 2>/dev/null || true
          node -e "
            const fs = require('fs');
            if (fs.existsSync('.env')) {
              const content = fs.readFileSync('.env', 'utf8');
              const lines = content.split('\n');
              const extraLines = [];
              const foundKeys = [];
              for (const line of lines) {
                const match = line.trim().match(/^([A-Za-z0-9_]+)=(.*)$/);
                if (match) {
                  const key = match[1];
                  const val = match[2];
                  foundKeys.push(key);
                  if (!key.startsWith('EXPO_PUBLIC_')) {
                    extraLines.push('EXPO_PUBLIC_' + key + '=' + val);
                  }
                }
              }
              if (extraLines.length) {
                fs.appendFileSync('.env', '\n' + extraLines.join('\n') + '\n');
              }
              console.log('Detected environment variable keys:', foundKeys);
            } else {
              console.log('No .env file created from EAS env:pull');
            }
          "

      - name: 🚀 Publish EAS OTA Update to Preview & Production Channels
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Publishing OTA update to preview channel..."
          eas update --channel preview --environment preview --message "${{ github.event.head_commit.message || 'OTA Update' }}" --non-interactive
          echo "Publishing OTA update to production channel..."
          eas update --channel production --environment production --message "${{ github.event.head_commit.message || 'OTA Update' }}" --non-interactive

