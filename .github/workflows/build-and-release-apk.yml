name: Build & Publish APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.2). Leave empty to use version in app.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: EAS Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏷 Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./app.json').expo.version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: 🔨 Build Android APK via EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS Build for Android (preview profile - APK)..."
          eas build --platform android --profile preview --non-interactive --json > build_info.json
          cat build_info.json

      - name: 📥 Download Built APK
        run: |
          BUILD_URL=$(jq -r 'if type=="array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' build_info.json)
          if [ "$BUILD_URL" == "null" ] || [ -z "$BUILD_URL" ]; then
            echo "Failed to retrieve APK build URL from EAS."
            exit 1
          fi
          echo "Downloading APK from: $BUILD_URL"
          curl -L "$BUILD_URL" -o Pocket-${{ steps.release_tag.outputs.tag }}.apk

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Pocket ${{ steps.release_tag.outputs.tag }}"
          files: Pocket-${{ steps.release_tag.outputs.tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
